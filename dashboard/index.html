<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloraSense Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout concept: operator console. Navy rail on the left (bottom tabs on phones), light work area, status shown by pill + stripe, curves drawn to scale. */
:root{
  --navy:#062F37; --green:#006D44; --leaf:#008C47; --muted-brand:#45626A; --amber:#E0A526; --red:#C2412D;
  --bg:#EFF4F4; --surface:#FFFFFF; --surface2:#F5F9F8; --mint:#E2EEEA; --ink:#062F37; --muted:#45626A; --line:#D2E0DF;
  --accent:#006D44; --accent2:#008C47; --on-accent:#FFFFFF;
  --ok:#006D44; --ok-soft:rgba(0,140,71,.13); --warn:#9A6A00; --warn-soft:rgba(224,165,38,.2); --bad:#C2412D; --bad-soft:rgba(194,65,45,.12);
  --rail:#062F37; --rail-ink:#E3EFEE; --rail-muted:#8FB0B3;
  --phase-dark:rgba(6,47,55,.10); --phase-light:rgba(224,165,38,.10); --phase-rec:rgba(0,140,71,.08);
  --band:rgba(0,140,71,.16); --grid:rgba(69,98,106,.18);
  --c1:#006D44; --c2:#2E7D9A; --c3:#B8860B;
  --paper:#FBFAF5; --paper-ink:#062F37; --paper-line:#C9D6D3;
  --shadow:0 1px 2px rgba(6,47,55,.06),0 4px 14px rgba(6,47,55,.05);
  --font:'IBM Plex Sans','Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-ar:'IBM Plex Sans','Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04171C; --surface:#082A31; --surface2:#0B333B; --mint:#0F3B3D; --ink:#E6F0EF; --muted:#9DB8BC; --line:#17474F;
    --accent:#2FBF85; --accent2:#2BB673; --on-accent:#032A1B;
    --ok:#3CCB8E; --ok-soft:rgba(60,203,142,.16); --warn:#EDB93E; --warn-soft:rgba(224,165,38,.2); --bad:#EE7B67; --bad-soft:rgba(238,123,103,.16);
    --rail:#031E24; --rail-ink:#E3EFEE; --rail-muted:#7FA1A5;
    --phase-dark:rgba(0,0,0,.28); --phase-light:rgba(224,165,38,.09); --phase-rec:rgba(60,203,142,.08);
    --band:rgba(60,203,142,.18); --grid:rgba(157,184,188,.18);
    --c1:#3CCB8E; --c2:#6CC0DE; --c3:#EDB93E; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04171C; --surface:#082A31; --surface2:#0B333B; --mint:#0F3B3D; --ink:#E6F0EF; --muted:#9DB8BC; --line:#17474F;
  --accent:#2FBF85; --accent2:#2BB673; --on-accent:#032A1B;
  --ok:#3CCB8E; --ok-soft:rgba(60,203,142,.16); --warn:#EDB93E; --warn-soft:rgba(224,165,38,.2); --bad:#EE7B67; --bad-soft:rgba(238,123,103,.16);
  --rail:#031E24; --rail-ink:#E3EFEE; --rail-muted:#7FA1A5;
  --phase-dark:rgba(0,0,0,.28); --phase-light:rgba(224,165,38,.09); --phase-rec:rgba(60,203,142,.08);
  --band:rgba(60,203,142,.18); --grid:rgba(157,184,188,.18);
  --c1:#3CCB8E; --c2:#6CC0DE; --c3:#EDB93E; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--font-ar);line-height:1.65}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand svg{flex:none}
.brand b{font-size:17px;letter-spacing:.2px;font-family:'IBM Plex Sans',sans-serif}
.brand small{display:block;color:var(--rail-muted);font-size:11px;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:var(--rail-muted);cursor:pointer;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--rail-ink)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.nav button:focus-visible{outline:2px solid #5fd3a0}
.nav svg{width:19px;height:19px;flex:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--rail-muted)}
.cabchip{border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 11px;display:grid;gap:4px}
.cabchip b{color:var(--rail-ink);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);display:inline-block;box-shadow:0 0 0 3px rgba(0,140,71,.25);flex:none}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(0,140,71,0)}}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.1px}
html[lang="ar"] .top h1{font-weight:600}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--warn);color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.iconbtn{width:38px;height:38px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:var(--mint);color:var(--ink)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--surface2)}

.story{border-bottom:1px solid var(--line);background:var(--mint)}
.story-in{padding:10px max(24px,env(safe-area-inset-right,0px)) 10px max(24px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.steps span.done{color:var(--ok)}
.story p{margin:0;flex:1;min-width:200px;font-weight:500}

.views{padding:22px max(24px,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));display:block}
.view{display:flex;flex-direction:column;gap:18px;max-width:1380px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 2px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;gap:18px;min-width:0}
.g-2-1{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-8-4{grid-template-columns:minmax(0,8fr) minmax(0,4fr)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
html[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:12px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.p-g{background:var(--ok-soft);color:var(--ok)} .p-y{background:var(--warn-soft);color:var(--warn)} .p-r{background:var(--bad-soft);color:var(--bad)}
.p-n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.p-dark{background:rgba(6,47,55,.12);color:var(--ink)} :root[data-theme="dark"] .p-dark{background:rgba(255,255,255,.1)}
.p-light{background:var(--warn-soft);color:var(--warn)} .p-rec{background:var(--ok-soft);color:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p-dark{background:rgba(255,255,255,.1)}}

/* overview */
.statband{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:0}
.stat{padding:14px 18px;border-inline-end:1px solid var(--line);display:grid;gap:3px;min-width:0}
.stat:last-child{border-inline-end:0}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat .s{font-size:12px;color:var(--muted)}
.big{font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0}
.meter{height:10px;background:var(--mint);border-radius:99px;overflow:hidden;margin:12px 0 6px}
:root[data-theme="dark"] .meter{background:var(--surface2)}
.meter i{display:block;height:100%;background:var(--accent2);border-radius:99px}
.kv{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.kv div{display:grid;gap:0}
.kv b{font-size:20px;font-weight:600}
.kv span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:16px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent2);min-height:2px}
.bars i.future{background:transparent;border:1px dashed var(--grid);border-bottom:0}
.bars i.now{background:linear-gradient(to top,var(--accent2) 66%,transparent 66%);border:1px solid var(--accent2);border-bottom:0}
.bars span{font-size:10.5px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 12px;gap:2px}
.stack i{display:block;height:100%}
.legend{display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend b{margin-inline-start:auto}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.tblwrap{overflow-x:auto;margin:0 -6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:start;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
html[lang="ar"] th{text-transform:none;letter-spacing:0;font-size:12px}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tr.row:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
tr:last-child td{border-bottom:0}
.mixrow{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px;margin-bottom:9px}
.mixrow .trk{height:8px;background:var(--mint);border-radius:99px;overflow:hidden}
:root[data-theme="dark"] .mixrow .trk{background:var(--surface2)}
.mixrow .trk i{display:block;height:100%;background:var(--accent2);border-radius:99px}
.mixrow b{text-align:end;font-weight:600}
.ar-name{font-family:'Readex Pro',var(--font-ar);font-weight:500}
.libnote{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.libtot{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.libtot b{font-size:26px;font-weight:600;letter-spacing:-.5px}

/* intake */
.scanner{background:var(--rail);border-radius:12px;color:#fff;padding:18px;display:grid;gap:14px;position:relative;overflow:hidden}
.scanner .view-box{position:relative;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:14px;background:rgba(255,255,255,.04);display:grid;place-items:center;min-height:250px}
.scanner svg{max-width:100%;height:auto}
.scanline{position:absolute;inset-inline:10px;top:10px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#5fe3a8,transparent);box-shadow:0 0 14px #5fe3a8;opacity:0}
.scanning .scanline{opacity:1;animation:sweep 1.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:calc(100% - 13px)}}
.nfcwave{opacity:0}
.scanning.nfc .nfcwave{animation:wave 1.1s infinite}
.nfcwave:nth-of-type(2){animation-delay:.2s!important}.nfcwave:nth-of-type(3){animation-delay:.4s!important}
@keyframes wave{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.scanstat{font-size:13px;color:#BFD6D7;display:flex;align-items:center;gap:8px;min-height:22px}
.scanbtns{display:flex;gap:10px;flex-wrap:wrap}
.scanner .btn{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.scanner .btn.primary{background:#2FBF85;color:#032A1B;border-color:#2FBF85}
.scanner .btn:hover{border-color:#5fe3a8}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:#BFD6D7}
.chk input{width:16px;height:16px;accent-color:#2FBF85}
.rec{display:grid;gap:0}
.rec .f{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;transition:opacity .25s}
.rec .f:last-of-type{border-bottom:0}
.rec .f .l{color:var(--muted);font-size:12.5px}
.rec .f .v{font-weight:500;min-width:0;overflow-wrap:anywhere}
.rec .f.empty .v{color:var(--muted);opacity:.5}
.rec .f.in{animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.trayg{display:grid;grid-template-columns:repeat(4,26px);gap:5px;direction:ltr}
.trayg i{width:26px;height:26px;border-radius:50%;background:var(--mint);border:1px solid var(--line);display:block}
.trayg i.on{background:var(--leaf);border-color:var(--green);animation:pop .3s both}
.trayg i.miss{background:var(--bad-soft);border:1px dashed var(--bad)}
@keyframes pop{from{transform:scale(.4)}}
.count{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cnt{font-size:22px;font-weight:700}
.blocked{border:1px solid var(--bad);background:var(--bad-soft);color:var(--ink);border-radius:10px;padding:12px 14px;display:grid;gap:10px;margin-top:12px}
.blocked b{color:var(--bad)}
.okbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:500;color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2)}
.chip.done{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.chip.cur{color:var(--ink);border-color:var(--accent2)}
.assign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.assign label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:38px;max-width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* cabin */
.boxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.box::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--line)}
.box[data-st="dark"]::before{background:var(--navy)} :root[data-theme="dark"] .box[data-st="dark"]::before{background:#6e8f94}
.box[data-st="light"]::before{background:var(--amber)} .box[data-st="recovery"]::before,.box[data-st="done"]::before{background:var(--leaf)}
.box[data-st="loading"]::before,.box[data-st="purging"]::before{background:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .box[data-st="dark"]::before{background:#6e8f94}}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box-h b{font-size:15px}
.box-info{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--muted);min-height:36px}
.box-info b{color:var(--ink);font-weight:600}
.pbar{display:flex;gap:2px;height:7px}
.pbar div{border-radius:2px;background:var(--mint);position:relative;overflow:hidden}
:root[data-theme="dark"] .pbar div{background:var(--surface2)}
.pbar div i{position:absolute;inset:0;display:block;transform-origin:left;background:var(--accent2)}
html[dir="rtl"] .pbar div i{transform-origin:right}
.pbar div.d i{background:var(--muted)} .pbar div.l i{background:var(--amber)}
.cd{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.cd b{color:var(--ink);font-variant-numeric:tabular-nums}
.minichart{height:104px;direction:ltr}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}
.vals div{background:var(--surface2);border-radius:8px;padding:5px 8px;display:grid}
.vals span{color:var(--muted);font-size:11px}
.vals b{font-variant-numeric:tabular-nums;font-size:13px;direction:ltr;text-align:start}
html[dir="rtl"] .vals b{text-align:end}
.box-foot{display:flex;gap:8px;align-items:center;min-height:30px}
.sealpic{display:flex;gap:2px;direction:ltr}
.wheelwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:center}
.wheel{width:240px;height:240px;direction:ltr}
.wheel .port{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.wheel .port.live{fill:var(--mint);stroke:var(--accent2)}
.wheel .port.act{fill:var(--accent);stroke:var(--accent)}
.wheel text{font:600 11px var(--font);fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.wheel .port.act+text{fill:var(--on-accent)}
.wheel .ptr{transition:transform .12s linear;transform-origin:120px 120px}
.hubt{font:600 11px var(--font);fill:var(--ink);text-anchor:middle}
.timeline{display:grid;gap:6px}
.tl{display:flex;height:22px;border-radius:7px;overflow:hidden;font-size:11px;font-weight:600}
.tl div{display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;white-space:nowrap}
.tl .fl{background:var(--warn-soft);color:var(--warn);flex:5}.tl .rd{background:var(--ok-soft);color:var(--ok);flex:4}
.tl i{position:absolute;inset-block:0;inset-inline-start:0;background:rgba(0,0,0,.1)}
.pathstrip{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap}
.node{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface2);display:grid;gap:1px}
.node b{font-size:13px}.node span{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.link{flex:0 0 28px;position:relative;align-self:center;height:2px;background:var(--line);overflow:visible}
.link::after{content:"";position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent2);inset-inline-start:0;animation:flow 1.1s linear infinite}
html[dir="rtl"] .link{transform:scaleX(-1)}
@keyframes flow{from{inset-inline-start:0;opacity:1}to{inset-inline-start:22px;opacity:.1}}
.log{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--mono);font-size:12px;direction:ltr}
.logh,.logr{display:grid;grid-template-columns:62px 54px 88px 82px 88px minmax(0,1fr);gap:8px;padding:4px 10px;align-items:center}
.logh{background:var(--surface2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.logbody{height:236px;overflow:hidden}
.logr{border-top:1px solid var(--line);white-space:nowrap}
.logr.ref{color:var(--c2)} .logr.cal{color:var(--warn)}
.logr.new{animation:flash .6s}
@keyframes flash{from{background:var(--ok-soft)}}
.logr span:last-child{overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.dpath-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* result */
.resh{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.decide{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.light{display:flex;flex-direction:column;gap:7px;background:var(--navy);padding:10px;border-radius:99px}
.light i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);display:block}
.light i.on-g{background:#25d38a;box-shadow:0 0 14px #25d38a}.light i.on-y{background:#f3b73a;box-shadow:0 0 14px #f3b73a}.light i.on-r{background:#f0604a;box-shadow:0 0 14px #f0604a}
.dtitle{font-size:24px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px}
.dtitle.g{color:var(--ok)}.dtitle.y{color:var(--warn)}.dtitle.r{color:var(--bad)}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ans{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;background:var(--surface2);align-content:start;min-width:0}
.ans .q{font-size:11.5px;color:var(--muted);font-weight:600}
.ans .a{font-size:17px;font-weight:600;line-height:1.3}
.ans .d{font-size:12.5px;color:var(--muted)}
.probs{display:grid;gap:3px;margin-top:4px}
.probs div{display:grid;grid-template-columns:70px minmax(0,1fr) 30px;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.probs i{display:block;height:5px;border-radius:3px;background:var(--grid)}
.probs i b{display:block;height:100%;border-radius:3px;background:var(--accent2)}
.chartgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chartbox{min-width:0}
.chartbox h3{font-size:13px;margin:0 0 2px;font-weight:600}
.chartbox .sub{font-size:12px;color:var(--muted);margin:0 0 4px}
.chart{direction:ltr;width:100%}
.chart svg{display:block;overflow:visible}
.ax{fill:var(--muted);font:10px var(--font)}
.axl{fill:var(--muted);font:600 10px var(--font)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px}
.lg i.bnd{height:10px;background:var(--band)}
.siggrid{display:grid;gap:0}
.sigrow{display:grid;grid-template-columns:minmax(120px,1.1fr) 90px minmax(120px,2fr) 110px 24px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sigrow:last-child{border-bottom:0}
.sigrow .n b{display:block;font-weight:600}
.sigrow .n span{font-size:12px;color:var(--muted)}
.sigrow .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.sigrow .val small{font-size:12px;color:var(--muted);font-weight:500}
.gauge{position:relative;height:10px;background:var(--grid);border-radius:99px;direction:ltr}
.gauge .z{position:absolute;top:0;bottom:0;background:var(--band);border:1px solid var(--accent2);border-radius:99px;opacity:.9}
.gauge .m{position:absolute;top:-4px;width:6px;height:18px;border-radius:3px;transform:translateX(-3px)}
.gauge .m.g{background:var(--ok)}.gauge .m.y{background:var(--warn)}.gauge .m.r{background:var(--bad)}
.sigrow .rng{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sdot{width:12px;height:12px;border-radius:50%;display:block}
.sdot.g{background:var(--ok)}.sdot.y{background:var(--amber)}.sdot.r{background:var(--bad)}
.cert-wrap{display:grid;place-items:center;padding:6px 0}
.cert{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:6px;width:100%;max-width:820px;padding:12px;box-shadow:0 8px 30px rgba(6,47,55,.18);position:relative;overflow:hidden}
.cert-in{border:2px solid var(--navy);padding:26px 28px;position:relative;display:grid;gap:18px;outline:1px solid var(--navy);outline-offset:-7px}
.cert-h{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cert h3{font-size:24px;margin:0;font-weight:700;letter-spacing:-.3px}
.cert .eyebrow{color:#45626A}
.cert-id{font-family:var(--mono);font-size:12px;color:#45626A}
.cert-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
.cert dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px;margin:0;font-size:13.5px}
.cert dt{color:#45626A}.cert dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.cert-side{display:grid;gap:10px;justify-items:center}
.seal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:12px;line-height:1.2;border:3px double;padding:6px;color:#fff}
.seal.g{background:#006D44;border-color:#cfe9db}.seal.y{background:#9A6A00;border-color:#f5e3b5}.seal.r{background:#C2412D;border-color:#f6d3cc}
.qrbox{background:#fff;padding:6px;border:1px solid var(--paper-line);display:grid;gap:3px;justify-items:center;font-size:10px;color:#45626A}
.cert-sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;font-size:12.5px;border-top:1px solid var(--paper-line);padding-top:12px}
.cert-sig div{display:flex;justify-content:space-between;gap:8px}
.cert-sig span{color:#45626A}
.cert-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--paper-line);padding-top:12px;font-size:12px;color:#45626A}
.nfc{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:#062F37}
.water{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:62px;font-weight:700;letter-spacing:4px;color:rgba(6,47,55,.05);transform:rotate(-18deg);white-space:nowrap}
.sel{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spec{width:100%;display:block}
.toast{position:fixed;inset-inline-end:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-weight:500;z-index:60;max-width:min(420px,calc(100vw - 36px));animation:fadein .25s}
.bottom{display:none}
.foot{padding:0 max(24px,env(safe-area-inset-right,0px)) 26px max(24px,env(safe-area-inset-left,0px));color:var(--muted);font-size:12px}

@media (max-width:1180px){
  .boxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .answers{grid-template-columns:repeat(2,minmax(0,1fr))}

  .statband{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat{border-bottom:1px solid var(--line)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--rail);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottom button{all:unset;box-sizing:border-box;display:grid;justify-items:center;gap:2px;padding:6px 2px;color:var(--rail-muted);font-size:11px;font-weight:600;border-radius:8px;text-align:center;cursor:pointer}
  .bottom button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
  .bottom svg{width:20px;height:20px}
  .views{padding-bottom:90px}
  .foot{padding-bottom:90px}
  .wheelwrap{grid-template-columns:minmax(0,1fr);justify-items:center}
  .g-2,.g-3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .top-in,.story-in{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .views,.foot{padding-inline-start:max(16px,env(safe-area-inset-left,0px));padding-inline-end:max(16px,env(safe-area-inset-right,0px))}
  html[dir="rtl"] .views,html[dir="rtl"] .foot{padding-inline-start:max(16px,env(safe-area-inset-right,0px));padding-inline-end:max(16px,env(safe-area-inset-left,0px))}
  .boxgrid,.answers{grid-template-columns:minmax(0,1fr)}
  .statband{grid-template-columns:repeat(2,minmax(0,1fr))}
  .big{font-size:36px}
  .decide{grid-template-columns:minmax(0,1fr)}
  .light{flex-direction:row;justify-self:start}
  .sigrow{grid-template-columns:minmax(0,1fr) auto 24px;grid-template-areas:"n val dot" "g g g" "r r r";gap:6px 10px}
  .sigrow .n{grid-area:n}.sigrow .val{grid-area:val}.sigrow .gauge{grid-area:g}.sigrow .rng{grid-area:r}.sigrow .sdot{grid-area:dot}
  .cert-in{padding:16px 14px}
  .cert-main{grid-template-columns:minmax(0,1fr)}
  .cert-side{grid-auto-flow:column;justify-content:start;align-items:center}
  .cert dl{grid-template-columns:100px minmax(0,1fr)}
  .cert-sig{grid-template-columns:minmax(0,1fr)}
  .rec .f{grid-template-columns:100px minmax(0,1fr)}
  .assign{grid-template-columns:minmax(0,1fr)}
  .pathstrip{flex-direction:column}
  .link{flex:0 0 22px;width:2px;height:22px;align-self:center}
  .link::after{animation:none}
  .logh,.logr{grid-template-columns:58px 40px 70px 62px 66px;gap:5px;padding:4px 6px}
  .logh span:last-child,.logr span:last-child{display:none}
  .mixrow{grid-template-columns:84px minmax(0,1fr) 30px}
  .top h1{font-size:16px}
  .water{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .rail,.top,.story,.bottom,.foot,.toast,.view:not(#v-result),.noprint{display:none!important}
  body{background:#fff}.app{display:block}.views{padding:0}
  #v-result>*:not(.cert-card){display:none!important}
  .cert-card{border:0!important;box-shadow:none!important;padding:0!important}
  .cert{box-shadow:none}
}

@media (max-width:900px){.tiles4{grid-template-columns:repeat(2,minmax(0,1fr))!important}.stage{grid-template-columns:minmax(0,1fr)}.camwrap{grid-template-columns:minmax(0,1fr)}.calrow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.camgrid{grid-template-columns:repeat(6,40px)}.camgrid div{width:40px;height:40px}}

<script>
(function(){
'use strict';
/* ============ utils ============ */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));

/* ============ domain data ============ */
const SP={
 sidr:{en:'Sidr',ar:'سدر',lat:'Ziziphus spina-christi',A:26,lag:70,th:110,E:1.0,tau:50},

const SCK=Object.keys(SC);

function mk(sp,sc,seed,jit){
  const s=SP[sp],c=SC[sc],j=(k,a)=>jit===false?1:1+a*nz(seed,k);
  const voc={};for(const g in c.voc)voc[g]=c.voc[g]*(g==='unk'?1:j(10,.1));
  return {sp,sc,seed,A:s.A*c.A*j(1,.04),lag:s.lag*c.lag*j(2,.05),th:s.th*c.th*j(3,.05),E:s.E*c.E*j(4,.05),tau:s.tau*c.tau*j(5,.06),
    R:5.5*Math.sqrt(s.A/26)*j(6,.08),eth:c.eth*j(7,.1),voc,dec:c.dec};
}
function dco2(P,t){
  const R=P.R;
  if(t<300)return R*(1-Math.exp(-Math.max(t,0)/40));
  const d0=R*(1-Math.exp(-300/40));
  const light=tt=>{const u=tt-300-P.lag;const v=u<=0?0:1-Math.exp(-u*Math.LN2/P.th);return d0-(d0+P.A*1.06)*v};
  if(t<900)return light(t);
  return light(900)+(R-light(900))*(1-Math.exp(-(t-900)/P.tau));
}
function dh2o(P,t){
  const b=0.15;
  if(t<300)return b*(1-Math.exp(-Math.max(t,0)/40));
  const lag=P.lag*.8,th=P.th*.9;
  const light=tt=>{const u=tt-300-lag;const v=u<=0?0:1-Math.exp(-u*Math.LN2/th);return b+(P.E-b)*v};
  if(t<900)return light(t);
  return light(900)+(b-light(900))*(1-Math.exp(-(t-900)/(P.tau*1.2)));
}
function eth(P,t){
  const x=clamp(t/1080,0,1);
  return 3.0+P.eth*Math.pow(x,P.sc==='disease'?1.7:1.1);
}
function vocSum(P){let s=0;for(const g in P.voc)if(g!=='unk')s+=P.voc[g];return s}
// readings (with deterministic noise) for a tray at test-time t
function reading(P,t,k){
  return {d:dco2(P,t)+.55*nz(P.seed,k*3+1),h:dh2o(P,t)+.02*nz(P.seed,k*3+2),e:eth(P,t)+.22*nz(P.seed,k*3+3)};
}
function refAt(T){return 420.4+1.6*Math.sin(T/2400)+.25*nz(77,Math.floor(T/9))}
const PERIOD=63;
function sampleTray(P,off){const pts=[];for(let k=0;k<17;k++){const t=40+PERIOD*k+off;pts.push([t,reading(P,t,k+off)])}return pts}

function sigOf(P){
  const A=-dco2(P,895);const Em=dh2o(P,895)-dh2o(P,299);
  return {lag:P.lag,th:P.th,A:A,ae:A/Math.max(Em,.05),tau:P.tau,stress:P.eth+vocSum(P)};
}
function normOf(sp){
  const N=mk(sp,'healthy',1,false),s=sigOf(N);
  const f=(v,a,b)=>[v*a,v*b];
  return {lag:f(s.lag,.75,1.25),th:f(s.th,.75,1.25),A:f(s.A,.86,1.14),ae:f(s.ae,.82,1.18),tau:f(s.tau,.7,1.3),stress:[0,6],mid:s};
}
function band(sp,fn){
  const N=mk(sp,'healthy',1,false),lo=Object.assign({},N,{A:N.A*.86,lag:N.lag*1.25,th:N.th*1.25,E:N.E*.82,tau:N.tau*1.3}),hi=Object.assign({},N,{A:N.A*1.14,lag:N.lag*.75,th:N.th*.75,E:N.E*1.18,tau:N.tau*.7});
  const out=[];for(let t=0;t<=1080;t+=30){const a=fn(lo,t),b=fn(hi,t);out.push([t,Math.min(a,b)-(fn===eth?0:0),Math.max(a,b)])}
  if(fn===eth){return out.map(([t,a,b])=>[t,2.2,3.4+2.6*clamp(t/1080,0,1)])}
  const pad=fn===dco2?1.2:.06;return out.map(([t,a,b])=>[t,a-pad,b+pad]);
}

/* batches */
function mkBatch(id,sp,sc,nurs,age,seed,doneT){
  const n=NURS[nurs];
  return {id,sp,sc,nurs,age,seed,doneT,tr:[{id:'T-'+(5000+seed%4000)},{id:'T-'+(5001+seed%4000)}],camp:n.camp,live:false};
}
function trayP(b,i){return mk(b.sp,b.sc,b.seed*2+i+1)}
function analyse(b){
  if(b.res)return b.res;
  const sA=sigOf(trayP(b,0)),sB=sigOf(trayP(b,1));
  const sig={};for(const k in sA)sig[k]=(sA[k]+sB[k])/2;
  const c=SC[b.sc],nm=normOf(b.sp);
  const rows=['lag','th','A','ae','tau','stress'].map(k=>{
    const v=sig[k],[lo,hi]=nm[k];const w=hi-lo;
    const out=v<lo?(lo-v)/w:v>hi?(v-hi)/w:0;
    let st=out===0?'g':out<.9?'y':'r';
    if(k==='stress'&&b.sc==='unknown')st='g';
    return {k,v,lo,hi,st};
  });
  const sv=clamp(c.surv+.02*nz(b.seed,5),.2,.97);
  const half=b.sc==='healthy'?.04:.08;
  const probs={healthy:0,water:0,salinity:0,hypoxia:0,disease:0};
  const keys=Object.keys(probs);const top=b.sc==='unknown'?'healthy':b.sc;
  const conf=c.conf+.015*nz(b.seed,6);
  let rest=1-conf,wsum=0;const w={};keys.forEach((k,i)=>{if(k!==top){w[k]=.2+hash(b.seed,40+i);wsum+=w[k]}});
  keys.forEach(k=>probs[k]=k===top?conf:rest*w[k]/wsum);
  const eth0=3.0,eth1=3.0+(trayP(b,0).eth+trayP(b,1).eth)/2;
  b.res={sig,rows,nm,surv:sv,lo:Math.max(0,sv-half),hi:Math.min(1,sv+half),dec:c.dec,conf,probs,spMatch:c.sp+.01*nz(b.seed,8),eth0,eth1,voc:Object.assign({},trayP(b,0).voc)};
  return b.res;
}

/* seeded history for today */
function buildHistory(){
  const r=rnd(20261121),arr=[];
  const wsc=[['healthy',.6],['water',.13],['hypoxia',.08],['salinity',.06],['disease',.05],['unknown',.08]];
  for(let i=0;i<31;i++){
    const sp=SPK[Math.floor(r()*6)];let x=r(),sc='healthy',acc=0;for(const [k,w] of wsc){acc+=w;if(x<acc){sc=k;break}}
    const nl=SPN[sp];const nu=nl[Math.floor(r()*nl.length)];
    arr.push(mkBatch('B-'+(2417-i),sp,sc,nu,8+Math.floor(r()*14),100+i*13,42240-i*560-Math.floor(r()*120)));
  }
  return arr;
}

let lang='en';
function t(k,vars){let s=L[lang][k];if(s==null)s=L.en[k];if(typeof s==='string'&&vars)s=s.replace(/\{(\w+)\}/g,(m,n)=>vars[n]!=null?vars[n]:m);return s}
const spn=k=>SP[k][lang];
const nursn=k=>NURS[k][lang];

/* ============ state ============ */
const S={
  T:11*3600+48*60,speed:20,view:'overview',
  batches:buildHistory(),boxes:[],valve:{seq:[],i:0,pt:0,cycle:0,port:7,phase:'flush',ang:0,lastReadPort:null},
  log:[],nRead:0,qi:0,sel:null,traysToday:62,seedlingsToday:744,
  story:{running:false,tok:0,step:0},
  bgq:0
};
S.sel=S.batches[0].id;
function bgTray(){const q=S.bgq++;const s=SPK[(q*5+2)%6],scs=['healthy','healthy','water','healthy','hypoxia','healthy','healthy','salinity'];const sc=scs[(q*3+1)%scs.length];const nl=SPN[s];const nu=nl[q%nl.length];return mkBatch('B-'+(2440+q),s,sc,nu,12,900+q*7,0)}
function initBoxes(){
  for(let n=1;n<=6;n++)S.boxes.push({n,st:null,tray:null,bg:n>=4,pts:[],nextAt:0,batch:null,ti:0,done:false,counted:false});
  const pre={4:[630,0],5:[140+150,1],6:[1010+150,2]}; // elapsed since assign
  for(const n of [4,5,6]){
    const b=S.boxes[n-1];const bt=bgTray();b.batch=bt;b.ti=0;b.tray=bt.tr[0];b.P=trayP(bt,0);
    const e=n===4?150+640:n===5?150+120:150+330;
    b.st=S.T-e;
    for(let k=0;k<30;k++){const tt=40+PERIOD*k;if(tt>e-150-5)break;const r=reading(b.P,tt,k);b.pts.push({t:tt,d:r.d,h:r.h,e:r.e})}
  }
  // box 3 free for manual use as well, but starts empty with background auto-fill after a while
  S.boxes[2].bg=false;
}
function phaseOf(b){
  if(b.st==null)return {s:'empty',e:0};
  const e=S.T-b.st;
  if(e<60)return {s:'loading',e,rem:60-e};
  if(e<150)return {s:'purging',e,rem:150-e};
  if(e<450)return {s:'dark',e,rem:450-e};
  if(e<1050)return {s:'light',e,rem:1050-e};
  if(e<1230)return {s:'recovery',e,rem:1230-e};
  return {s:'done',e,rem:0};
}
const TOTAL=1230;

/* ============ engine ============ */
function planCycle(){
  const v=S.valve;v.cycle++;
  const seq=[];
  S.boxes.forEach(b=>{const p=phaseOf(b).s;if(p==='dark'||p==='light'||p==='recovery')seq.push(b.n)});
  seq.push(7);if(v.cycle%10===0)seq.push(8);
  v.seq=seq;v.i=0;v.pt=0;
}
function stepEngine(dt){
  const v=S.valve;let rem=dt;
  S.T+=dt;
  // background boxes lifecycle
  S.boxes.forEach(b=>{
    if(!b.bg)return;
    const p=phaseOf(b);
    if(p.s==='done'&&S.T-b.st>TOTAL+90){b.st=null;b.tray=null;b.pts=[];b.nextAt=S.T+45}
    if(b.st==null&&b.nextAt&&S.T>=b.nextAt){const bt=bgTray();b.batch=bt;b.ti=0;b.tray=bt.tr[0];b.P=trayP(bt,0);b.st=S.T;b.pts=[];b.nextAt=0}
  });
  while(rem>0){
    if(!v.seq.length||v.i>=v.seq.length)planCycle();
    const step=Math.min(rem,9-v.pt);
    v.pt+=step;rem-=step;
    v.phase=v.pt<5?'flush':'read';v.port=v.seq[v.i];
    if(v.pt>=9-1e-9){doReading(v.seq[v.i]);v.i++;v.pt=0;if(v.i>=v.seq.length)planCycle();v.port=v.seq[v.i];}
  }
  checkBatches();
}
function doReading(port){
  S.nRead++;
  const T=S.T;let co2,h2o,c2h4,cls='';
  const ref=refAt(T);
  if(port===7){co2=ref;h2o=11.8+.05*nz(5,S.nRead);c2h4=2.1+.2*nz(6,S.nRead);cls='ref'}
  else if(port===8){co2=500.0+.15*nz(8,S.nRead);h2o=0.02;c2h4=0;cls='cal'}
  else{
    const b=S.boxes[port-1];
    if(b.st==null||!b.P)return;
    const tt=T-b.st-150-2;if(tt<0)return;
    const r=reading(b.P,tt,b.pts.length+port*50);
    b.pts.push({t:tt,d:r.d,h:r.h,e:r.e});
    co2=ref+r.d;h2o=11.8+r.h;c2h4=r.e;
  }
  const row={time:hms(T),port:port===7?'REF':port===8?'CAL':'B'+port,co2:fx(co2,1),h2o:fx(h2o,2),eth:fx(c2h4,1),cls,id:S.nRead};
  S.log.unshift(row);if(S.log.length>40)S.log.length=40;
  S.logDirty=true;
}
function checkBatches(){
  S.boxes.forEach(b=>{
    if(b.bg||!b.batch||b.counted)return;
    const p=phaseOf(b);if(p.s!=='done')return;
    const other=S.boxes.find(x=>x!==b&&x.batch===b.batch);
    if(other&&phaseOf(other).s!=='done')return;
    b.counted=true;if(other)other.counted=true;
    const bt=b.batch;bt.doneT=S.T;bt.live=true;
    S.batches.unshift(bt);S.traysToday+=2;S.seedlingsToday+=24;S.sel=bt.id;S.liveId=bt.id;
    renderOverview();renderResult();
    toast(t('toast_res',{b:bt.id}));
    if(S.onBatchDone)S.onBatchDone(bt);
  });
}

/* ============ charts ============ */
function lineChart(w,h,c){
  const m=c.compact?{l:30,r:6,t:6,b:16}:{l:46,r:10,t:c.phaseLabels?20:10,b:24};
  const iw=Math.max(40,w-m.l-m.r),ih=h-m.t-m.b;
  const X=v=>m.l+(v-0)/(1080-0)*iw,Y=v=>m.t+(1-(v-c.y[0])/(c.y[1]-c.y[0]))*ih;
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+(c.label||'chart')+'">';
  // phases
  s+='<rect x="'+X(0)+'" y="'+m.t+'" width="'+(X(300)-X(0))+'" height="'+ih+'" fill="var(--phase-dark)"/>';

function spectrumSvg(w,h,b){
  const res=analyse(b),P=trayP(b,0);
  const x0=9.0,x1=11.0,m={l:34,r:10,t:26,b:22},iw=w-m.l-m.r,ih=h-m.t-m.b;
  const peaks=[
    {n:'ethanol',x:9.5,a:.04+.0075*(P.voc.ethanol||0),wd:.03,lab:'ethanol'},
    {n:'methanol',x:9.72,a:.05+.007*(P.voc.methanol||0),wd:.03,lab:'methanol'},
    {n:'acetald',x:9.88,a:.03+.008*(P.voc.acetald||0),wd:.025,lab:'acetaldehyde'},
    {n:'ammonia',x:10.35,a:.05+.02*(P.voc.ammonia||0),wd:.03,lab:'NH₃'},
    {n:'eth',x:10.53,a:.08+.02*P.eth,wd:.03,lab:'C₂H₄',anchor:1},
    {n:'h2o',x:9.3,a:.15,wd:.05,lab:'H₂O',anchor:1},
    {n:'co2',x:10.2,a:.2,wd:.045,lab:'CO₂',anchor:1}
  ];
  if(b.sc==='unknown')peaks.push({n:'unk',x:10.62,a:.13,wd:.022,lab:'?',unk:1});
  const N=512,pts=[];let ymax=0;
  for(let i=0;i<N;i++){const x=x0+(x1-x0)*i/(N-1);let y=.02+.004*nz(b.seed,i);peaks.forEach(p=>{y+=p.a*Math.exp(-Math.pow((x-p.x)/p.wd,2))});pts.push([x,y]);ymax=Math.max(ymax,y)}
  ymax=Math.max(ymax,.3)*1.12;
  const X=v=>m.l+(v-x0)/(x1-x0)*iw,Y=v=>m.t+(1-v/ymax)*ih;
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="spectrum">';
  [0,.1,.2,.3].forEach(v=>{if(v<ymax)s+='<line x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-dasharray="2 3"/><text class="ax" x="'+(m.l-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>'});
  for(let v=9;v<=11;v+=.5)s+='<text class="ax" x="'+X(v)+'" y="'+(h-6)+'" text-anchor="middle">'+v.toFixed(1)+'</text>';
  s+='<text class="axl" x="'+(m.l+iw)+'" y="'+(h-6)+'" text-anchor="end" dx="0"></text>';
  s+='<path d="M'+pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' L')+'" fill="none" stroke="var(--c1)" stroke-width="1.4"/>';
  peaks.forEach(p=>{
    if(p.a<.07&&!p.anchor&&!p.unk)return;
    const px=X(p.x),py=Y(.02+p.a);
    const col=p.unk?'var(--bad)':p.anchor?'var(--ink)':'var(--muted)';
    const ty=Math.max(12,py-8);
    s+='<text class="axl" x="'+px+'" y="'+ty+'" text-anchor="middle" style="fill:'+col+'">'+(p.unk?'?':p.lab)+'</text>';
    if(p.unk)s+='<circle cx="'+px+'" cy="'+py+'" r="9" fill="none" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="3 2"/>';
  });
  s+='</svg>';return s;
}
function qrSvg(seed,n,px){
  const r=rnd(seed*7+13),cell=px/n;let d='';
  const fin=(x,y)=>x<7&&y<7||x>=n-7&&y<7||x<7&&y>=n-7;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    let on;
    if(fin(x,y)){const lx=x%(n-7)>=0&&x>=n-7?x-(n-7):x,ly=y>=n-7?y-(n-7):y;on=(lx===0||lx===6||ly===0||ly===6)||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}
    else if(x===7&&y<8||y===7&&x<8||(x===n-8&&y<8)||(y===7&&x>=n-8)||(x===7&&y>=n-8)||(y===n-8&&x<8))on=false;
    else on=r()>.52;
    if(on)d+='M'+(x*cell).toFixed(2)+' '+(y*cell).toFixed(2)+'h'+cell.toFixed(2)+'v'+cell.toFixed(2)+'h-'+cell.toFixed(2)+'z';
  }
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'" role="img" aria-label="QR"><rect width="'+px+'" height="'+px+'" fill="#fff"/><path d="'+d+'" fill="#062F37"/></svg>';
}

async function doScan(mode,forceShort){
  if(I.busy)return;
  I.busy=true;I.mode=mode;I.scan='scanning';I.cur=null;I.reveal=0;renderIntake();
  await sleep(1300);
  const n=I.trays[0]?2:1,b=I.batch;
  const short=forceShort!=null?forceShort:I.short;
  I.cur={id:b.tr[n-1].id,n,count:short?11:12};
  I.scan='read';
  for(let i=1;i<=6;i++){I.reveal=i;renderIntake();await sleep(170)}
  if(I.cur.count===12){I.trays[n-1]=I.cur}
  I.busy=false;renderIntake();
}
function fixTray(){
  if(!I||!I.cur||I.cur.count>=12)return;
  I.cur.count=12;I.trays[I.cur.n-1]=I.cur;I.short=false;renderIntake();
}
function assignTrays(){
  if(!I||!I.trays[0]||!I.trays[1]||I.assigned)return false;
  const sel=I.sel.slice();
  const bs=[S.boxes[sel[0]-1],S.boxes[sel[1]-1]];
  if(bs.some(x=>!x||x.st!=null))return false;
  bs.forEach((bx,i)=>{bx.batch=I.batch;bx.ti=i;bx.tray=I.trays[i];bx.P=trayP(I.batch,i);bx.st=S.T;bx.pts=[];bx.bg=false;bx.done=false;bx.counted=false});
  I.assigned=true;S.liveBatch=I.batch;
  S.qi++;
  renderIntake();
  return true;
}

/* ============ camera ============ */
const CAMF={healthy:0,water:3,salinity:2,hypoxia:1,disease:1,unknown:0};
function camOf(b){
  if(b.cam)return b.cam;
  const n=CAMF[b.sc]||0,trays=[];
  for(let ti=0;ti<2;ti++){const want=ti===0?Math.ceil(n/2):Math.floor(n/2),fl=[];let k=0;
    while(fl.length<want&&k<60){const c=Math.floor(hash(b.seed,300+ti*37+k)*12);if(!fl.includes(c))fl.push(c);k++}
    trays.push(fl.sort((x,y)=>x-y))}
  b.cam={trays,n,conf:Math.round(90+8*hash(b.seed,999))};
  return b.cam;
}
function camCard(b){
  const c=camOf(b),flag=t('fl_'+b.sc);
  const grids=c.trays.map((fl,ti)=>{
    let cells='';for(let i=0;i<12;i++)cells+='<div class="'+(fl.includes(i)?'flag':'')+'"'+(fl.includes(i)?' title="'+flag+'"':'')+'><b>'+(i+1)+'</b>'+IC.sprout+'</div>';
    return '<div><div class="eyebrow" style="margin-bottom:6px">'+t('cam_tray',{n:ti+1})+' · <span class="mono">'+b.tr[ti].id+'</span></div><div class="camgrid">'+cells+'</div></div>';
  }).join('');
  const list=c.trays.map((fl,ti)=>fl.length?t('cam_tray',{n:ti+1})+': '+fl.map(x=>'#'+(x+1)).join(lang==='ar'?'، ':', '):'').filter(Boolean).join(' · ');
  return '<div class="card"><h2>'+IC.cam.replace('<svg ','<svg style="width:18px;height:18px;vertical-align:-3px;margin-inline-end:6px" ')+t('cam_t')+'</h2><p class="sub">'+t('cam_s')+'</p>'+
   '<div class="camwrap"><div class="camtrays">'+grids+'</div><div class="camans">'+
    '<div class="ans"><span class="q">'+t('cam_count')+'</span><span class="a num">24 / 24</span><span class="d">'+t('cam_count_d')+'</span></div>'+
    '<div class="ans"><span class="q">'+t('cam_sp')+'</span><span class="a">'+spn(b.sp)+' <i style="font-weight:500;font-size:13px;color:var(--muted)">'+SP[b.sp].lat+'</i></span><span class="d">'+t('cam_agree',{p:c.conf})+'</span></div>'+
    '<div class="ans"><span class="q">'+t('cam_flags')+'</span><span class="a" style="color:'+(c.n?'var(--warn)':'var(--ok)')+'">'+(c.n?c.n+' · '+flag:t('cam_none'))+'</span><span class="d">'+(c.n?list:t('cam_none_d'))+'</span></div>'+

/* ============ scenario ============ */
function setStep(n,txtKey){
  S.story.step=n;
  $('#steps').innerHTML=['s1','s2','s3','s4','s5'].map((k,i)=>'<span class="'+(i+1===n?'on':i+1<n?'done':'')+'">'+(i+1<n?'✓ ':'')+t(k)+'</span>').join('');
  $('#storytxt').textContent=t(txtKey);S.story.txt=txtKey;
}
function stopScenario(){
  S.story.running=false;S.story.tok++;$('#story').hidden=true;setPlayBtn();S.onBatchDone=null;
}
async function playScenario(){
  if(S.story.running){stopScenario();return}
  const tok=++S.story.tok;S.story.running=true;
  const alive=()=>S.story.running&&S.story.tok===tok;
  const wait=async ms=>{const t0=performance.now();while(alive()&&performance.now()-t0<ms)await sleep(40);return alive()};
  setPlayBtn();$('#story').hidden=false;
  // reset manual boxes 1-3 that are not background
  S.boxes.forEach(b=>{if(!b.bg&&b.st!=null&&phaseOf(b).s==='done'){b.st=null;b.tray=null;b.pts=[];b.batch=null}});
  const prevSpeed=S.speed;S.speed=60;
  if(!I||I.assigned||I.trays[0]||I.cur){I=newIntake()}
  I.short=false;
  const freeBoxes=S.boxes.filter(b=>b.st==null);
  setStep(1,'st1');go('intake');
  if(!await wait(900))return;
  await doScan('nfc',false);if(!await wait(1200))return;
  I.short=false;
  setStep(1,'st1b');
  await doScan('qr',true);if(!await wait(2800))return;
  fixTray();if(!await wait(1500))return;
  setStep(2,'st2');
  if(!await wait(500))return;
  renderIntake();
  if(!await wait(1400))return;
  const done=new Promise(res=>{S.onBatchDone=bt=>res(bt)});
  if(!assignTrays()){stopScenario();return}
  const bt=S.liveBatch;
  await wait(900);
  go('cabin');setStep(3,'st3');
  // wait for batch done
  let finished=null;done.then(x=>finished=x);
  while(alive()&&!finished)await sleep(100);
  if(!alive())return;
  setStep(4,'st4');S.sel=bt.id;renderResult();go('result');
  if(!await wait(5200))return;
  setStep(5,'st5');
  const cw=$('#cert');if(cw)cw.scrollIntoView({behavior:'smooth',block:'center'});
  if(!await wait(500))return;
  S.speed=prevSpeed===60?60:20;
  S.onBatchDone=null;
  await wait(6000);
  if(alive()){S.story.running=false;setPlayBtn()}
}

try{const th=localStorage.getItem('fs-theme');if(th)document.documentElement.setAttribute('data-theme',th);const lg=localStorage.getItem('fs-lang');if(lg==='ar'||lg==='en')lang=lg}catch(e){}
try{const q=new URLSearchParams(location.search);if(q.get('lang'))lang=q.get('lang')==='ar'?'ar':'en';if(q.get('theme'))document.documentElement.setAttribute('data-theme',q.get('theme'))}catch(e){}
initBoxes();planCycle();
for(let i=0;i<10;i++)stepEngine(9); // warm-up readings so the log is populated
I=newIntake();
const h=(location.hash||'').replace('#','');if(VIEWS.includes(h))S.view=h;
renderAll();go(S.view,true);
let lastF=performance.now(),acc=0,lastOv=0;
function frame(now){
  const dt=Math.min(100,now-lastF)/1000;lastF=now;
  stepEngine(dt*S.speed);
  acc+=dt;
  if(acc>.08){acc=0;if(S.view==='cabin')updateCabin();$$('[data-clock]').forEach(x=>{const v=hms(S.T);if(x.textContent!==v)x.textContent=v})}
  
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__fs={S:S,go:go,play:playScenario,adv:s=>stepEngine(s)};
})();
</script>
